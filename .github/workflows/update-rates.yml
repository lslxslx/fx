name: Update official FX rates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: do not change or commit JSON files"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: fx-data-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ inputs.dry_run }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Test parser and update safeguards
        run: |
          test -f scripts/test_update_rates.py
          python3 -m unittest discover -s scripts -p 'test_update_rates.py' -v

      - name: Fetch and validate official rates
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            python3 scripts/update_rates.py
          else
            python3 scripts/update_rates.py --write
          fi

      - name: Commit only the nine currency histories
        if: github.event_name == 'schedule' || inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/eur.json data/usd.json data/gbp.json data/chf.json data/jpy.json data/aud.json data/cad.json data/xau.json data/xag.json
          if git diff --cached --quiet; then
            echo "No new publication. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update official exchange rates"
          git push origin "HEAD:$DEFAULT_BRANCH"
